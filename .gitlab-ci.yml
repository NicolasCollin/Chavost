stages:
  - lint
  - typecheck
  - audit
  - test


# template for uv installation (Shell executor safe: no system-wide pip)
.ci-template:
  cache:
    key: "uv-cache"
    paths:
      - .uv-cache
      - .venv
  variables:
    UV_CACHE_DIR: .uv-cache
  before_script:
    - |
      set -euo pipefail

      echo "[CI] Python: $(python3 --version || true)"

      # --- Create / reuse a local virtualenv to avoid PEP 668 (externally-managed-environment)
      if [ ! -d ".venv" ]; then
        echo "[CI] Creating venv (.venv)"
        python3 -m venv .venv || {
          echo "[CI][ERROR] Failed to create venv. On Debian/Raspberry Pi you likely need: sudo apt-get install -y python3-venv";
          exit 1;
        }
      fi

      . .venv/bin/activate

      # --- Install tools inside the venv (NOT system-wide)
      python -m pip install --upgrade pip
      python -m pip install --upgrade uv

      uv --version

      # Sync deps (prefer locked)
      uv sync --frozen || uv sync


# pre-commit hooks
lint:
  stage: lint
  extends: .ci-template
  script:
    - . .venv/bin/activate
    - uv run pre-commit run --all-files --show-diff-on-failure
  allow_failure: true


# mypy static type checker
typecheck:
  stage: typecheck
  extends: .ci-template
  script:
    - . .venv/bin/activate
    - uv run mypy --ignore-missing-imports src
  allow_failure: true


# look for vulnerable dependencies
audit:
  stage: audit
  extends: .ci-template
  script:
    - . .venv/bin/activate
    - uv run pip-audit --version
    - uv run pip-audit .
  allow_failure: true


# unit tests, doctests, and behave tests
test:
  stage: test
  extends: .ci-template
  script:
    - . .venv/bin/activate
    - |
      if [ -d tests ]; then
        uv run pytest --doctest-modules --maxfail=3 --disable-warnings -q || rc=$?
        if [ "${rc:-0}" -eq 5 ]; then
          echo "Pytest found no tests; skipping as success."
          exit 0
        else
          exit "${rc:-0}"
        fi
      else
        echo "No tests directory; skipping pytest."
      fi
    - |
      if [ -d tests/behave/features ]; then
        uv run behave tests/behave/features || exit 1
      else
        echo "No behave features; skipping behave."
      fi
